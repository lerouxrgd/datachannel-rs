name: Build & test with dynamic deps

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature: ["default", "media", "vendored-libdatachannel"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Activate MSVC environment so cmake-rs can locate the Visual Studio generator
      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install libssl-dev

      - if: matrix.os == 'macos-latest'
        run: |
          HOMEBREW_NO_INSTALL_CLEANUP=1 brew reinstall openssl@3
          echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L /opt/homebrew/opt/openssl@3/lib" >> $GITHUB_ENV

      - if: matrix.os == 'windows-latest'
        run: |
          choco install openssl --version 3.1.1
          echo "CARGO_ENCODED_RUSTFLAGS=-Lnative=C:\Program Files\OpenSSL\lib" >> $env:GITHUB_ENV

      - run: rustup update
      - run: cargo build --features ${{ matrix.feature }}
      - run: cargo fmt --check --all
      - run: cargo clippy --features ${{ matrix.feature }} -- -D warnings
      - if: matrix.os == 'windows-latest'
        run: (gci -r -fi datachannel.dll).fullname | select -last 1 | Split-Path >> $env:GITHUB_PATH
      - run: cargo test --features ${{ matrix.feature }} --verbose
